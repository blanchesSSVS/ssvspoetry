  //換字體

  var fontHei = true;

  function funFont(el,font){
    el.style.fontFamily=font;
  }

  var ming = "'Noto Serif TC', serif";
  var hei = "'Noto Sans TC', sans-serif";

  function chgFont(){
    if(fontHei == true){
      funFont(shi,ming);
      funFont(title,ming);
      funFont(signature,ming);
      fontHei = false;
      shi.style.fontWeight = 600;
      title.style.fontWeight = 600;
    }else{
      funFont(shi,hei);
      funFont(title,hei);
      funFont(signature,hei);
      fontHei = true;
      shi.style.fontWeight = 500;
      title.style.fontWeight = 500;
    }
  }

  document.getElementById("fontImg").addEventListener("click",chgImg);

  function chgImg(){
    if(fontHei == true){
      document.getElementById("fontImg").src="image/hei.svg"
    }else{
      document.getElementById("fontImg").src="image/ming.svg"
    }

  }

  // 字體加大
  
  var plus = 0;
  var minus = 0;
  
  var shiFS, titleFS, signatureFS; 
  if(document.body.offsetWidth > 992){
    shiFS = 36;
    titleFS = 28;
    signatureFS = 13;
  }
  else if(document.body.offsetWidth > 0){
    shiFS = 24;
    titleFS = 16;
    signatureFS = 9;
    plus = 2;
  }
  function fsPlus(){
    if(plus < 3){
      plus++;
      minus--;
      shiFS = shiFS + 3;
      shi.style.fontSize = shiFS + "px";
      titleFS = titleFS + 1;
      title.style.fontSize = titleFS + "px";
      signatureFS = signatureFS + 3;
      signature.style.fontSize = signatureFS + "px";
    }
  }
  function fsMinus(){
    if(minus < 1){
      minus++;
      plus--;
      shiFS = shiFS - 3;
      shi.style.fontSize = shiFS + "px";
      titleFS = titleFS - 1;
      title.style.fontSize = titleFS + "px";
      signatureFS = signatureFS - 3;
      signature.style.fontSize = signatureFS + "px";
    }
  }

	function enableDragSort(listClass) {
		const sortableLists = document.getElementsByClassName(listClass);
		Array.prototype.map.call(sortableLists, (list) => {enableDragList(list)});
	}

	function enableDragList(list) {
		Array.prototype.map.call(list.children, (item) => {enableDragItem(item)});
	}

	function enableDragItem(item) {
		item.setAttribute('draggable', true)
		item.ondrag = handleDrag;
		item.ondragend = handleDrop;
	}

	function handleDrag(item) {
		const selectedItem = item.target,
		list = selectedItem.parentNode,
		x = event.clientX,
		y = event.clientY;
  
  	selectedItem.classList.add('drag-sort-active');
  		let swapItem = document.elementFromPoint(x, y) === null ? selectedItem : document.elementFromPoint(x, y);
  	
  	if (list === swapItem.parentNode) {
		swapItem = swapItem !== selectedItem.nextSibling ? swapItem : swapItem.nextSibling;
		list.insertBefore(selectedItem, swapItem);
  	}
//		showtext();
	}

	function handleDrop(item) {
		item.target.classList.remove('drag-sort-active');
	}

	(()=> {enableDragSort('drag-sort-enable')})();
